<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Avanzado - Aprendiendo las Vocales</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Librería de Confeti para el efecto de fiesta -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="avanzado.css">
</head>
<body>

      <header>
        <!-- Botón Corregido -->
        <a class="back-btn" href="index.html" aria-label="Volver atrás">
            <i class="back-arrow"></i>
        </a>
        <h1 class="header-title">Nivel Avanzado</h1>
        <div class="header-spacer"></div>
    </header>


    <!-- REPRODUCTORES DE AUDIO -->
    <audio id="audio-clic" src="clickboton.mp3" preload="auto"></audio>
    <audio id="audio-correcto" src="correcto.mp3" preload="auto"></audio>
    <audio id="audio-error" src="errorr.mp3" preload="auto"></audio>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5 text-center">
        <!-- Instrucción -->
        <p class="fs-5 text-secondary mb-4" id="instruccion">Descubre las cartas y encuentra las parejas de cada vocal.</p>

        <!-- Tablero del juego -->
        <div class="game-board mb-4" id="tablero"></div>

        <!-- Mensaje de éxito -->
        <div id="mensaje-ganador" class="fs-3 fw-bold text-success mt-3"></div>
        <button id="btn-reiniciar" class="btn btn-warning btn-lg fw-bold mt-3 d-none" onclick="reiniciarJuego()">¡Jugar de Nuevo!</button>
    </main>


    <!-- JAVASCRIPT  -->
    <script>
        //  Datos de las cartas
        const cartasData = [
            { id: 'A1', pareja: 'A', tipo: 'imagen', contenido: 'imagenes/ardilla.jpg', texto: 'ARDILLA' },
            { id: 'A2', pareja: 'A', tipo: 'imagen', contenido: 'imagenes/avion.jpg', texto: 'AVIÓN' },
            
            { id: 'E1', pareja: 'E', tipo: 'imagen', contenido: 'imagenes/elefante.png', texto: 'ELEFANTE' },
            { id: 'E2', pareja: 'E', tipo: 'imagen', contenido: '??.jpg', texto: '??' },

            { id: 'I1', pareja: 'I', tipo: 'imagen', contenido: 'imagenes/animales de tarjeta/iguana.png', texto: 'IGUANA' },
            { id: 'I2', pareja: 'I', tipo: 'imagen', contenido: '??', texto: '??' },

            { id: 'O1', pareja: 'O', tipo: 'imagen', contenido: 'ovejag.jpg', texto: 'OVEJA' },
            { id: 'O2', pareja: 'O', tipo: 'imagen', contenido: 'imagenes/animales de tarjeta/oso.png', texto: 'OSO' },

            { id: 'U1', pareja: 'U', tipo: 'imagen', contenido: '??', texto: '??' },
            { id: 'U2', pareja: 'U', tipo: 'imagen', contenido: 'imagenes/animales de tarjetas/urraca.png', texto: 'URRACA' }
        ];

        let primeraCarta = null;
        let segundaCarta = null;
        let bloqueoTablero = false;
        let parejasEncontradas = 0;

        const audioClic = document.getElementById("clickboton.mp3");
        const audioCorrecto = document.getElementById("correcto.mp3");
        const audioError = document.getElementById("error.mp3");

        //  Barajar cartas
        function barajarCartas() {
            for (let i = cartasData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cartasData[i], cartasData[j]] = [cartasData[j], cartasData[i]];
            }
        }

        // Crear tablero
        function crearTablero() {
            const tablero = document.getElementById("tablero");
            tablero.innerHTML = "";
            barajarCartas();

            for (let i = 0; i < cartasData.length; i++) {
                const carta = document.createElement("div");
                carta.classList.add("card-item", "oculta");
                carta.dataset.pareja = cartasData[i].pareja;
                carta.dataset.tipo = cartasData[i].tipo;
                carta.dataset.contenido = cartasData[i].contenido;
                carta.dataset.texto = cartasData[i].texto;
                
                carta.innerText = "❓";
                
                carta.addEventListener("click", voltearCarta);
                tablero.appendChild(carta);
            }
        }

        // Voltear carta
        function voltearCarta() {
            if (bloqueoTablero) return;
            if (this === primeraCarta) return;
            if (!this.classList.contains("oculta")) return;

            audioClic.currentTime = 0;
            audioClic.play();

            this.classList.remove("oculta");

            if (this.dataset.tipo === "imagen") {
                this.innerHTML = `
                    <div class="card-image-container">
                        <img src="${this.dataset.contenido}" alt="${this.dataset.texto}">
                    </div>
                    <span class="texto-carta">${this.dataset.texto}</span>
                `;
            } else {
                this.innerHTML = `
                    <div class="card-image-container" style="font-size: 3.5rem; font-weight: bold; color: #4a148c; height: 120px;">
                        ${this.dataset.contenido}
                    </div>
                    <span class="texto-carta">${this.dataset.texto}</span>
                `;
            }

            if (!primeraCarta) {
                primeraCarta = this;
                return;
            }

            segundaCarta = this;
            verificarPareja();
        }

        //  Verificar parejas
        function verificarPareja() {
            let coincide = primeraCarta.dataset.pareja === segundaCarta.dataset.pareja;

            if (coincide) {
                audioCorrecto.currentTime = 0;
                audioCorrecto.play();

                parejasEncontradas++;
                resetearSeleccion();

                // Efecto de confeti al encontrar una pareja
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 }
                });

                if (parejasEncontradas === 5) {
                    document.getElementById("instruccion").innerText = "¡Correcto!🎉";
                    document.getElementById("mensaje-ganador").innerText = "¡Muy bien!";
                    document.getElementById("btn-reiniciar").classList.remove("d-none");
                }
            } else {
                audioError.currentTime = 0;
                audioError.play();

                bloqueoTablero = true;
                setTimeout(() => {
                    primeraCarta.classList.add("oculta");
                    primeraCarta.innerText = "❓";
                    segundaCarta.classList.add("oculta");
                    segundaCarta.innerText = "❓";
                    resetearSeleccion();
                }, 1200);
            }
        }

        function resetearSeleccion() {
            primeraCarta = null;
            segundaCarta = null;
            bloqueoTablero = false;
        }

        function reiniciarJuego() {
            parejasEncontradas = 0;
            document.getElementById("mensaje-ganador").innerText = "";
            document.getElementById("instruccion").innerText = "Descubre las cartas y une cada vocal con su imagen y palabra correspondiente.";
            document.getElementById("btn-reiniciar").classList.add("d-none");
            crearTablero();
        }

        crearTablero();
    </script>
</body>
</html>
