<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Secreto - Rompecabezas de Vocales</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Librería de Confeti para el efecto de fiesta -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="intermedio.css">
    <style>
        /* Contenedor central principal */
        .secreto-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
        }

        /* Párrafo de instrucciones con texto normal (ancho mayor y alineado fluido) */
        .instrucciones-parrafo {
            font-size: 1.05rem;
            color: #444;
            text-align: center;
            width: 90%;
            max-width: 550px; /* Ampliado para que no parezca poema */
            margin: 0 auto 20px auto;
            line-height: 1.5;
            font-weight: 600;
        }

        /* Tablero del rompecabezas centrado en medio */
        .rompecabezas-tablero {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 202px;
            margin: 0 auto 20px auto;
            background-color: #ddd;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .pieza-slot {
            width: 95px;
            height: 95px;
            border: 2px dashed #4eb670;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            transition: background-color 0.3s;
        }
        .pieza-slot.drag-over {
            background-color: #d1e7dd;
            border-style: solid;
        }

        /* Box horizontal de piezas debajo, centrado perfectamente */
        .banco-piezas-box {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            background-color: #ffffff;
            border: 3px solid #e0e0e0;
            border-radius: 16px;
            padding: 12px 18px;
            width: fit-content;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .pieza-drag {
            width: 80px;
            height: 80px;
            background-size: 160px 160px;
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid white;
            flex-shrink: 0;
        }
        .pieza-drag:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <header>
        <a class="back-btn" href="index.html" aria-label="Volver atrás">
            <i class="back-arrow"></i>
        </a>
        <h1 class="header-title">🌟 Nivel Secreto 🌟</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="game-container">
        <img src="imagenes/tigrebailando.png" alt="Tigre animado" class="mascot-left">

        <div class="cards-grid">
            <div class="secreto-content">
                
                <!-- Párrafo de instrucciones corregido -->
                <p class="instrucciones-parrafo">
                    ¡Descubriste el nivel secreto! Arrastra cada pieza desde la caja horizontal inferior hasta su casilla correspondiente para armar el dibujo.
                </p>

                <!-- Tablero del rompecabezas centrado -->
                <div class="rompecabezas-tablero">
                    <div class="pieza-slot" id="slot-0" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 0)"></div>
                    <div class="pieza-slot" id="slot-1" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 1)"></div>
                    <div class="pieza-slot" id="slot-2" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 2)"></div>
                    <div class="pieza-slot" id="slot-3" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 3)"></div>
                </div>

                <!-- Box horizontal de piezas debajo -->
                <div class="banco-piezas-box" id="banco-piezas">
                    <!-- Las piezas se cargan dinámicamente -->
                </div>

                <div id="mensaje-secreto" class="fw-bold mt-1" style="font-size: 1.05rem; color: #00c853; min-height: 25px; text-align: center;"></div>
                
                <!-- Pantalla final -->
                <div id="pantalla-final-secreto" class="hidden mt-2" style="text-align: center;">
                    <div style="font-size: 3rem;">🎉🐝🏆</div>
                    <h2 style="color: #4eb670;">¡Felicidades!</h2>
                    <p style="font-size: 1.1rem; font-weight: bold; color: #333; margin: 10px 0;">Estás listo para lo siguiente.</p>
                    <a href="index.html" class="btn-siguiente-nivel mt-2" style="display: inline-block; padding: 10px 20px; background-color: #4eb670; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Volver al Menú Principal</a>
                </div>

            </div>
        </div>

        <img src="imagenes/leonbailando.png" alt="León animado" class="mascot-right">
    </div>

    <div id="feedback"></div>

    <script>
        const urlImagenAbeja = "imagenes/abeja.png";
        
        let piezasData = [
            { id: 0, bgPos: "0px 0px" },          
            { id: 1, bgPos: "-95px 0px" },        
            { id: 2, bgPos: "0px -95px" },        
            { id: 3, bgPos: "-95px -95px" }       
        ];

        let piezasColocadas = 0;

        function iniciarRompecabezas() {
            const banco = document.getElementById("banco-piezas");
            banco.innerHTML = "";
            document.getElementById("pantalla-final-secreto").classList.add("hidden");
            document.getElementById("mensaje-secreto").innerText = "";
            piezasColocadas = 0;

            for(let i=0; i<4; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.innerHTML = "";
                slot.style.borderStyle = "dashed";
                slot.style.borderColor = "#4eb670";
            }

            let piezasBarajadas = [...piezasData].sort(() => Math.random() - 0.5);

            piezasBarajadas.forEach(pieza => {
                const divPieza = document.createElement("div");
                divPieza.className = "pieza-drag";
                divPieza.draggable = true;
                divPieza.id = `pieza-${pieza.id}`;
                divPieza.style.backgroundImage = `url('${urlImagenAbeja}')`;
                divPieza.style.backgroundPosition = pieza.bgPos;
                divPieza.ondragstart = (ev) => {
                    ev.dataTransfer.setData("text", pieza.id);
                };
                banco.appendChild(divPieza);
            });
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add("drag-over");
        }

        function removeDropStyle(ev) {
            ev.currentTarget.classList.remove("drag-over");
        }

        function drop(ev, slotIndex) {
            ev.preventDefault();
            ev.currentTarget.classList.remove("drag-over");

            const piezaId = parseInt(ev.dataTransfer.getData("text"));
            const slot = document.getElementById(`slot-${slotIndex}`);

            if (slot.children.length > 0) return;

            if (piezaId === slotIndex) {
                const piezaElem = document.getElementById(`pieza-${piezaId}`);
                if (piezaElem) {
                    piezaElem.remove(); 
                    
                    const piezaFija = document.createElement("div");
                    piezaFija.style.width = "95px";
                    piezaFija.style.height = "95px";
                    piezaFija.style.backgroundImage = `url('${urlImagenAbeja}')`;
                    
                    if(piezaId === 0) piezaFija.style.backgroundPosition = "0px 0px";
                    if(piezaId === 1) piezaFija.style.backgroundPosition = "-95px 0px";
                    if(piezaId === 2) piezaFija.style.backgroundPosition = "0px -95px";
                    if(piezaId === 3) piezaFija.style.backgroundPosition = "-95px -95px";

                    piezaFija.style.borderRadius = "6px";
                    slot.appendChild(piezaFija);
                    slot.style.borderStyle = "solid";
                    slot.style.borderColor = "#00c853";

                    piezasColocadas++;
                    document.getElementById("mensaje-secreto").style.color = "#00c853";
                    document.getElementById("mensaje-secreto").innerText = "¡Muy bien! Pieza correcta ✨";

                    confetti({ particleCount: 40, spread: 50, origin: { y: 0.6 } });

                    if (piezasColocadas === 4) {
                        setTimeout(mostrarVictoriaSecreta, 600);
                    }
                }
            } else {
                document.getElementById("mensaje-secreto").style.color = "#f44336";
                document.getElementById("mensaje-secreto").innerText = "¡Ups! Ahí no va esa pieza. ¡Inténtalo de nuevo!";
                setTimeout(() => {
                    document.getElementById("mensaje-secreto").innerText = "";
                }, 1500);
            }
        }

        function mostrarVictoriaSecreta() {
            document.getElementById("mensaje-secreto").innerText = "";
            document.getElementById("pantalla-final-secreto").classList.remove("hidden");
            
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.5 }
            });
        }

        window.onload = iniciarRompecabezas;
    </script>
</body>
</html>
