<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Intermedio - Aprendiendo las Vocales</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Librería de Confeti para el efecto de fiesta -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Encabezado Celeste idéntico al Código 1 */
        header {
            background-color: #6aff14;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            transition: background-color 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .back-arrow {
            border: solid white;
            border-width: 0 6px 6px 0;
            display: inline-block;
            padding: 6px;
            transform: rotate(135deg);
        }

        .header-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
        }

        .header-spacer {
            width: 45px;
        }

        .game-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 30px auto;
            width: 100%;
            padding: 0 20px;
            flex: 1;
        }

        .mascot-left, .mascot-right {
            width: 220px;
            height: auto;
            object-fit: contain;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 220px);
            gap: 25px 35px;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        /* Estilo de las tarjetas adaptado al Nivel Intermedio */
        .card-item {
            background-color: white;
            border: 5px solid #6aff14;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            padding: 15px;
            width: 220px;
        }

        .card-item:hover {
            transform: scale(1.03);
        }

        .card-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: #ffffff;
            padding: 5px;
        }

        .card-image-container img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .palabra-incompleta {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
            text-align: center;
        }

        .input-vocal {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            border: 3px solid #6aff14;
            border-radius: 12px;
            text-transform: lowercase;
            display: inline-block;
            background-color: #f0f8ff;
        }

        .btn-comprobar {
            background-color: #6aff14;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            padding: 8px 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-comprobar:hover {
            background-color: #6aff14;
        }

        #feedback {
            text-align: center;
            font-size: 2rem;
            margin: 15px 0;
            min-height: 50px;
            font-weight: bold;
        }

        .correcto { color: #00c853; }
        .incorrecto { color: #f44336; }

        /* Estilo para los puntos generales */
        .puntuacion-container {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #6aff14;
            margin-top: 15px;
        }

        /* Pantalla de resultado final */
        #pantalla-resultado {
            text-align: center;
            margin: 20px auto;
            padding: 20px;
        }

        .btn-repetir {
            background-color: #6aff14;
            color: white;
            font-weight: 700;
            border-radius: 15px;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-repetir:hover {
            background-color: #6aff14;
        }

        @media (max-width: 900px) {
            .mascot-left, .mascot-right {
                display: none;
            }
            .game-container {
                justify-content: center;
            }
            .cards-grid {
                grid-template-columns: repeat(2, 170px);
                gap: 15px;
            }
            .card-item {
                width: 170px;
                padding: 10px;
            }
            .header-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a class="back-btn" href="index.html" aria-label="Volver atrás">
            <i class="back-arrow"></i>
        </a>
        <h1 class="header-title">Nivel Intermedio</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="puntuacion-container">
        PUNTOS: <span id="puntuacion">0</span> / 500
    </div>

    <div class="game-container">
        <img src="imagenes/tigrebailando.png" alt="Tigre animado" class="mascot-left">

        <div class="cards-grid" id="contenedor-ejercicios">
            <!-- Las tarjetas se cargan dinámicamente desde JavaScript -->
        </div>

        <img src="imagenes/leonbailando.png" alt="León animado" class="mascot-right">
    </div>

    <div id="feedback"></div>

    <!-- Pantalla de resultado final -->
    <div id="pantalla-resultado" class="hidden">
        <div id="carita-emoji" style="font-size: 4rem;"></div>
        <h2 id="mensaje-final" class="mt-3"></h2>
        <button class="btn-repetir mt-3" onclick="reiniciarJuego()">Jugar de nuevo</button>
    </div>

    <script>
        const listaEjercicios = [
            { id: 1, incompleta: "_ rbol", correcta: "a", imagen: "https://cdn-icons-png.flaticon.com/512/489/489969.png" },
            { id: 2, incompleta: "El_fante", correcta: "e", imagen: "https://cdn-icons-png.flaticon.com/512/3069/3069172.png" },
            { id: 3, incompleta: "Ig_u_na", correcta: "i", imagen: "https://cdn-icons-png.flaticon.com/512/3069/3069186.png" },
            { id: 4, incompleta: "_so", correcta: "o", imagen: "https://cdn-icons-png.flaticon.com/512/3069/3069224.png" },
            { id: 5, incompleta: "_vas", correcta: "u", imagen: "https://cdn-icons-png.flaticon.com/512/3137/3137044.png" }
        ];

        let puntos = 0;
        let respondidos = 0;
        const puntosPorAcierto = 100;
        const puntosPorError = 20;
        const puntosMaximos = listaEjercicios.length * puntosPorAcierto;

        function cargarEjercicios() {
            const contenedor = document.getElementById("contenedor-ejercicios");
            contenedor.innerHTML = "";

            listaEjercicios.forEach(ejercicio => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card-item";

                cardDiv.innerHTML = `
                    <div class="card-image-container">
                        <img src="${ejercicio.imagen}" alt="Objeto">
                    </div>
                    <div class="palabra-incompleta">
                        ${construirHTMLPalabra(ejercicio)}
                    </div>
                    <button id="btn-${ejercicio.id}" class="btn-comprobar" onclick="comprobarRespuesta(${ejercicio.id})">
                        Comprobar
                    </button>
                    <div id="mensaje-${ejercicio.id}" class="fw-bold mt-1" style="font-size: 0.9rem;"></div>
                `;
                contenedor.appendChild(cardDiv);
            });
        }

        function construirHTMLPalabra(ejercicio) {
            const partes = ejercicio.incompleta.split("_");
            return `${partes[0]}<input type="text" id="input-${ejercicio.id}" class="input-vocal" maxlength="1">${partes[1] || ''}`;
        }

        function comprobarRespuesta(id) {
            const ejercicio = listaEjercicios.find(e => e.id === id);
            const inputElem = document.getElementById(`input-${id}`);
            const mensajeElem = document.getElementById(`mensaje-${id}`);
            const btnElem = document.getElementById(`btn-${id}`);
            const feedbackGlobal = document.getElementById('feedback');

            const respuestaUsuario = inputElem.value.trim().toLowerCase();

            if (respuestaUsuario === "") {
                mensajeElem.style.color = "#FF9800";
                mensajeElem.innerText = "¡Escribe una vocal!";
                return;
            }

            if (respuestaUsuario === ejercicio.correcta) {
                puntos += puntosPorAcierto;
                mensajeElem.style.color = "#00c853";
                mensajeElem.innerText = "¡Correcto! 🎉";
                feedbackGlobal.textContent = "¡Muy bien!";
                feedbackGlobal.className = "correcto";

                inputElem.disabled = true;
                btnElem.disabled = true;
                cardDiv = inputElem.closest('.card-item');
                cardDiv.classList.add('completed');
                respondidos++;

                // Efecto de confeti en cada acierto correcto
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            } else {
                puntos = Math.max(0, puntos - puntosPorError);
                mensajeElem.style.color = "#f44336";
                mensajeElem.innerText = "¡Inténtalo de nuevo! ❌";
                feedbackGlobal.textContent = "¡Sigue intentando!";
                feedbackGlobal.className = "incorrecto";
                inputElem.value = "";
            }

            actualizarPuntaje();

            if (respondidos === listaEjercicios.length) {
                mostrarResultadoFinal();
            }
        }

        function actualizarPuntaje() {
            document.getElementById("puntuacion").innerText = puntos;
        }

        function mostrarResultadoFinal() {
            const pantallaResultado = document.getElementById("pantalla-resultado");
            const emojiElem = document.getElementById("carita-emoji");
            const mensajeElem = document.getElementById("mensaje-final");
            const feedbackGlobal = document.getElementById('feedback');

            feedbackGlobal.textContent = "";
            pantallaResultado.classList.remove("hidden");

            if (puntos === puntosMaximos) {
                emojiElem.innerText = "😊🎉";
                mensajeElem.innerText = "¡Felicidades! ¡Obtuviste todos los puntos!";
                mensajeElem.style.color = "#00c853";
                confetti({
                    particleCount: 150,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            } else {
                emojiElem.innerText = "😢💪";
                mensajeElem.innerText = `Lograste ${puntos} puntos. ¡Lo harás mucho mejor la próxima vez!`;
                mensajeElem.style.color = "#FF9800";
            }

            pantallaResultado.scrollIntoView({ behavior: 'smooth' });
        }

        function reiniciarJuego() {
            puntos = 0;
            respondidos = 0;
            actualizarPuntaje();
            document.getElementById("pantalla-resultado").classList.add("hidden");
            document.getElementById("feedback").textContent = "";
            cargarEjercicios();
        }

        window.onload = cargarEjercicios;
    </script>
</body>
</html>
