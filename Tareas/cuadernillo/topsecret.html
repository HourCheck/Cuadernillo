<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel Secreto - Rompecabezas de Vocales</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Librería de Confeti para el efecto de fiesta -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
  
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
}

body {
    background-color: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Encabezado Celeste */
header {
    background-color: #4eb670;
    padding: 15px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    position: relative;
}

.back-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    transition: background-color 0.2s;
    text-decoration: none;
}

.back-btn:hover {
    background-color: rgba(255, 255, 255, 0.2);
}

.back-arrow {
    border: solid white;
    border-width: 0 6px 6px 0;
    display: inline-block;
    padding: 6px;
    transform: rotate(135deg);
}

.header-title {
    color: white;
    font-size: 2.5rem;
    font-weight: 700;
    text-align: center;
    flex-grow: 1;
}

.header-spacer {
    width: 45px;
}

.game-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    max-width: 1100px;
    margin: 20px auto 10px auto;
    width: 100%;
    padding: 0 20px;
}

.mascot-left, .mascot-right {
    width: 320px;
    height: auto;
    object-fit: contain;
}

/* desplazamiento individual */
.mascot-left {
    transform: translateX(-40px); /* Mueve el tigre más a la izquierda */
}

.mascot-right {
    transform: translateX(40px); /* Mueve el león más a la derecha */
}

.cards-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-width: 0;
}

.hidden {
    display: none !important;
}

/* Estilo de las tarjetas */
.card-item {
    background-color: white;
    border: 5px solid #4eb670;
    border-radius: 25px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    padding: 12px;
    width: 220px;
}

.card-image-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background-color: #ffffff;
    padding: 5px;
}

.card-image-container img {
    width: 75px;
    height: 75px;
    object-fit: contain;
}

/* Clase para agrandar únicamente la imagen de la alpaca */
.card-image-container img.img-alpaca {
    width: 110px !important;
    height: 110px !important;
}

.palabra-incompleta {
    font-size: 1.6rem;
    font-weight: 700;
    color: #333;
    margin: 8px 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

/* Zona de soltar (Dropzone) */
.dropzone {
    width: 45px;
    height: 45px;
    border: 3px dashed #4eb670;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: bold;
    background-color: #f0f8ff;
    color: #333;
    vertical-align: middle;
}

.dropzone.drag-over {
    background-color: #d1e7dd;
    border-color: #4eb670;
}

/* Banco de letras flotantes posicionado abajo */
.banco-vocales {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px auto 25px auto;
    background: #f9f9f9;
    padding: 12px 25px;
    border-radius: 20px;
    max-width: 500px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 2px dashed #4eb670;
}

.vocal-drag {
    width: 50px;
    height: 50px;
    background-color: #4eb670;
    color: white;
    font-size: 1.8rem;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    user-select: none;
    transition: transform 0.1s;
}

.vocal-drag:active {
    cursor: grabbing;
    transform: scale(0.95);
}

.btn-comprobar {
    background-color: #4eb670;
    color: white;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    padding: 6px 12px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background-color 0.2s;
    width: 100%;
}

.btn-comprobar:hover {
    background-color: #4eb670;
}

#feedback {
    text-align: center;
    font-size: 1.8rem;
    margin: 10px 0;
    min-height: 40px;
    font-weight: bold;
}

.correcto { color: #4eb670; }
.incorrecto { color: #f44336; }

.puntuacion-container {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: #4eb670;
    margin-top: 10px;
}

#pantalla-resultado {
    text-align: center;
    margin: 20px auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Botón Rojo Grande "Siguiente Nivel" */
.btn-siguiente-nivel {
    display: inline-block;
    background-color: #ff3b30;
    color: #ffffff;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(255, 59, 48, 0.4);
    transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
}

.btn-siguiente-nivel:hover {
    background-color: #e03126;
    transform: scale(1.05);
    box-shadow: 0 10px 22px rgba(255, 59, 48, 0.5);
}

.btn-siguiente-nivel:active {
    transform: scale(0.98);
}

.mt-3 {
    margin-top: 1rem;
}

@media (max-width: 900px) {
    .mascot-left, .mascot-right {
        display: none;
    }
    .cards-grid {
        grid-template-columns: repeat(2, 170px);
        gap: 15px;
    }
    .card-item {
        width: 170px;
        padding: 10px;
    }
    .header-title {
        font-size: 1.8rem;
    }
}

    /* Contenedor principal */
.secreto-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    padding: 10px;
}

/* Instrucciones arriba, con mayor espacio horizontal */
.instrucciones-parrafo {
    font-size: 1.05rem;
    color: #444;
    text-align: center;
    width: 100%;
    max-width: 850px;
    margin: 0 auto 25px auto;
    line-height: 1.5;
    font-weight: 600;
}

/* Rompecabezas justo en el centro */
.rompecabezas-tablero {
    display: grid;
    grid-template-columns: repeat(2, 95px);
    gap: 6px;
    width: 202px;
    margin: 0 auto 20px auto;
    background-color: #ddd;
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Casillas */
.pieza-slot {
    width: 95px;
    height: 95px;
    border: 2px dashed #4eb670;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f9f9f9;
    transition: background-color 0.3s;
}

/* Caja de piezas */
.banco-piezas-box {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    background-color: #ffffff;
    border: 3px solid #e0e0e0;
    border-radius: 16px;
    padding: 12px 18px;
    width: fit-content;
    margin: 0 auto 15px auto;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

        .pieza-drag {
            width: 80px;
            height: 80px;
            background-size: 160px 160px;
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid white;
            flex-shrink: 0;
        }
        .pieza-drag:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <header>
        <a class="back-btn" href="index.html" aria-label="Volver atrás">
            <i class="back-arrow"></i>
        </a>
        <Nivel class="header-title">Nivel Secreto</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="game-container">
        <img src="imagenes/tigrebailando.png" alt="Tigre animado" class="mascot-left">

        <div class="cards-grid">
            <div class="secreto-content">
                
                <!-- Párrafo de instrucciones corregido -->
                <p class="instrucciones-parrafo">
                    ¡Descubriste el nivel secreto! Arrastra cada pieza desde la caja horizontal inferior hasta su casilla correspondiente para armar el dibujo.
                </p>

                <!-- Tablero del rompecabezas centrado -->
                <div class="rompecabezas-tablero">
                    <div class="pieza-slot" id="slot-0" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 0)"></div>
                    <div class="pieza-slot" id="slot-1" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 1)"></div>
                    <div class="pieza-slot" id="slot-2" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 2)"></div>
                    <div class="pieza-slot" id="slot-3" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 3)"></div>
                </div>

                <!-- Box horizontal de piezas debajo -->
                <div class="banco-piezas-box" id="banco-piezas">
                    <!-- Las piezas se cargan dinámicamente -->
                </div>

                <div id="mensaje-secreto" class="fw-bold mt-1" style="font-size: 1.05rem; color: #00c853; min-height: 25px; text-align: center;"></div>
                
                <!-- Pantalla final -->
                <div id="pantalla-final-secreto" class="hidden mt-2" style="text-align: center;">
                    <div style="font-size: 3rem;">🎉🐝🏆</div>
                    <h2 style="color: #4eb670;">¡Felicidades!</h2>
                    <p style="font-size: 1.1rem; font-weight: bold; color: #333; margin: 10px 0;">Estás listo para lo siguiente.</p>
                    <a href="index.html" class="btn-siguiente-nivel mt-2" style="display: inline-block; padding: 10px 20px; background-color: #4eb670; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Volver al Menú Principal</a>
                </div>

            </div>
        </div>

        <img src="imagenes/leonbailando.png" alt="León animado" class="mascot-right">
    </div>

    <div id="feedback"></div>

    <script>
        const urlImagenAbeja = "imagenes/abeja.png";
        
        let piezasData = [
            { id: 0, bgPos: "0px 0px" },          
            { id: 1, bgPos: "-95px 0px" },        
            { id: 2, bgPos: "0px -95px" },        
            { id: 3, bgPos: "-95px -95px" }       
        ];

        let piezasColocadas = 0;

        function iniciarRompecabezas() {
            const banco = document.getElementById("banco-piezas");
            banco.innerHTML = "";
            document.getElementById("pantalla-final-secreto").classList.add("hidden");
            document.getElementById("mensaje-secreto").innerText = "";
            piezasColocadas = 0;

            for(let i=0; i<4; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.innerHTML = "";
                slot.style.borderStyle = "dashed";
                slot.style.borderColor = "#4eb670";
            }

            let piezasBarajadas = [...piezasData].sort(() => Math.random() - 0.5);

            piezasBarajadas.forEach(pieza => {
                const divPieza = document.createElement("div");
                divPieza.className = "pieza-drag";
                divPieza.draggable = true;
                divPieza.id = `pieza-${pieza.id}`;
                divPieza.style.backgroundImage = `url('${urlImagenAbeja}')`;
                divPieza.style.backgroundPosition = pieza.bgPos;
                divPieza.ondragstart = (ev) => {
                    ev.dataTransfer.setData("text", pieza.id);
                };
                banco.appendChild(divPieza);
            });
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add("drag-over");
        }

        function removeDropStyle(ev) {
            ev.currentTarget.classList.remove("drag-over");
        }

        function drop(ev, slotIndex) {
            ev.preventDefault();
            ev.currentTarget.classList.remove("drag-over");

            const piezaId = parseInt(ev.dataTransfer.getData("text"));
            const slot = document.getElementById(`slot-${slotIndex}`);

            if (slot.children.length > 0) return;

            if (piezaId === slotIndex) {
                const piezaElem = document.getElementById(`pieza-${piezaId}`);
                if (piezaElem) {
                    piezaElem.remove(); 
                    
                    const piezaFija = document.createElement("div");
                    piezaFija.style.width = "95px";
                    piezaFija.style.height = "95px";
                    piezaFija.style.backgroundImage = `url('${urlImagenAbeja}')`;
                    
                    if(piezaId === 0) piezaFija.style.backgroundPosition = "0px 0px";
                    if(piezaId === 1) piezaFija.style.backgroundPosition = "-95px 0px";
                    if(piezaId === 2) piezaFija.style.backgroundPosition = "0px -95px";
                    if(piezaId === 3) piezaFija.style.backgroundPosition = "-95px -95px";

                    piezaFija.style.borderRadius = "6px";
                    slot.appendChild(piezaFija);
                    slot.style.borderStyle = "solid";
                    slot.style.borderColor = "#00c853";

                    piezasColocadas++;
                    document.getElementById("mensaje-secreto").style.color = "#00c853";
                    document.getElementById("mensaje-secreto").innerText = "¡Muy bien! Pieza correcta ✨";

                    confetti({ particleCount: 40, spread: 50, origin: { y: 0.6 } });

                    if (piezasColocadas === 4) {
                        setTimeout(mostrarVictoriaSecreta, 600);
                    }
                }
            } else {
                document.getElementById("mensaje-secreto").style.color = "#f44336";
                document.getElementById("mensaje-secreto").innerText = "¡Ups! Ahí no va esa pieza. ¡Inténtalo de nuevo!";
                setTimeout(() => {
                    document.getElementById("mensaje-secreto").innerText = "";
                }, 1500);
            }
        }

        function mostrarVictoriaSecreta() {
            document.getElementById("mensaje-secreto").innerText = "";
            document.getElementById("pantalla-final-secreto").classList.remove("hidden");
            
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.5 }
            });
        }

        window.onload = iniciarRompecabezas;
    </script>
</body>
</html>
